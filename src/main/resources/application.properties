spring.application.name=agentops-gate
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
server.shutdown=graceful
management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.probes.enabled=true
logging.structured.format.console=ecs

agentops.api-key=${AGENTOPS_API_KEY}
agentops.aws.enabled=${AGENTOPS_AWS_ENABLED:false}
agentops.approval.ttl=${APPROVAL_TTL:PT30M}
agentops.approval.expiry-interval=${APPROVAL_EXPIRY_INTERVAL:PT1M}
agentops.export.enabled=${AUDIT_EXPORT_ENABLED:false}
agentops.export.cron=${AUDIT_EXPORT_CRON:0 5 0 * * *}
