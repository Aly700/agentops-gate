spring.application.name=agentops-gate
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
server.shutdown=graceful
management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.probes.enabled=true
logging.structured.format.console=ecs
spring.task.scheduling.pool.size=${SCHEDULER_POOL_SIZE:3}

agentops.api-key=${AGENTOPS_API_KEY}
agentops.aws.enabled=${AGENTOPS_AWS_ENABLED:false}
agentops.aws.region=${AWS_REGION:}
agentops.aws.sqs.worker-enabled=${APPROVAL_WORKER_ENABLED:true}
agentops.aws.sqs.queue-url=${APPROVAL_QUEUE_URL:}
agentops.aws.sqs.dlq-url=${APPROVAL_DLQ_URL:}
agentops.aws.sqs.wait-time-seconds=${SQS_WAIT_TIME_SECONDS:20}
agentops.aws.sqs.max-messages=${SQS_MAX_MESSAGES:10}
agentops.aws.sqs.poll-interval=${SQS_POLL_INTERVAL:PT1S}
agentops.aws.sqs.worker-initial-delay=${SQS_WORKER_INITIAL_DELAY:PT1S}
agentops.aws.s3.bucket=${AUDIT_BUCKET:}
agentops.aws.s3.path-style-access-enabled=false
agentops.approval.ttl=${APPROVAL_TTL:PT30M}
agentops.approval.expiry-interval=${APPROVAL_EXPIRY_INTERVAL:PT1M}
agentops.idempotency.ttl=${IDEMPOTENCY_TTL:PT24H}
agentops.idempotency.sweep-interval=${IDEMPOTENCY_SWEEP_INTERVAL:PT1H}
agentops.outbox.relay-interval=${OUTBOX_RELAY_INTERVAL:PT1S}
agentops.outbox.relay-initial-delay=${OUTBOX_RELAY_INITIAL_DELAY:PT1S}
agentops.export.enabled=${AUDIT_EXPORT_ENABLED:false}
agentops.export.cron=${AUDIT_EXPORT_CRON:0 5 0 * * *}
